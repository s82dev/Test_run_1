<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Vegas Slot Machine</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #ff007f;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
            margin-bottom: 5px;
        }

        .casino-container {
            background: #222;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            border: 4px solid #00ffff;
            text-align: center;
            width: 320px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        #balance { color: #39ff14; text-shadow: 0 0 5px #39ff14; }
        #bet { color: #ffcc00; text-shadow: 0 0 5px #ffcc00; }

        .slots-display {
            display: flex;
            justify-content: space-around;
            background: #000;
            padding: 20px 10px;
            border-radius: 10px;
            border: 2px solid #555;
            margin-bottom: 25px;
        }

        .slot-box {
            font-size: 3.5rem;
            width: 70px;
            height: 80px;
            line-height: 80px;
            background: #111;
            border-radius: 10px;
            border: 2px solid #333;
            transition: transform 0.1s ease-in-out;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bet-adjust {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-small {
            background: #333;
            color: white;
            border: 1px solid #777;
            padding: 5px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1rem;
        }

        .btn-small:hover { background: #444; }

        .btn-spin {
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4);
            transition: all 0.2s;
        }

        .btn-spin:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255, 0, 127, 0.6);
        }

        .btn-spin:disabled {
            background: #444;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            margin-top: 20px;
            font-size: 1.2rem;
            min-height: 30px;
            font-weight: bold;
        }
        
        .win-flash { color: #39ff14; text-shadow: 0 0 10px #39ff14; animation: flash 0.5s infinite alternate; }
        .lose-flash { color: #ff3333; }

        @keyframes flash {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>NEON SLOTS</h1>
    
    <div class="casino-container">
        <div class="stats">
            <div>💰 Coins: <span id="balance">1000</span></div>
            <div>🎰 Einsatz: <span id="bet">10</span></div>
        </div>

        <div class="slots-display">
            <div class="slot-box" id="slot1">🍒</div>
            <div class="slot-box" id="slot2">🍋</div>
            <div class="slot-box" id="slot3">💎</div>
        </div>

        <div class="controls">
            <div class="bet-adjust">
                <button class="btn-small" onclick="changeBet(-5)">-5</button>
                <button class="btn-small" onclick="changeBet(5)">+5</button>
                <button class="btn-small" onclick="maxBet()">Max</button>
            </div>
            <button class="btn-spin" id="spinBtn" onclick="spin()">SPIN!</button>
        </div>

        <div id="message">Setze deinen Einsatz und dreh die Walzen!</div>
    </div>

    <script>
        const symbols = ['🍒', '🍋', '🍊', '🍇', '🔔', '💎', '7️⃣'];
        let balance = 1000;
        let currentBet = 10;
        let isSpinning = false;

        // Audio-Synthesizer für Retro-Sounds ohne externe Dateien
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, duration, type = "sine") {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function changeBet(amount) {
            if (isSpinning) return;
            let newBet = currentBet + amount;
            if (newBet >= 5 && newBet <= balance) {
                currentBet = newBet;
                document.getElementById('bet').innerText = currentBet;
                playTone(400, 0.05);
            }
        }

        function maxBet() {
            if (isSpinning) return;
            currentBet = Math.min(100, balance);
            document.getElementById('bet').innerText = currentBet;
            playTone(500, 0.08);
        }

        function spin() {
            if (isSpinning || balance < currentBet) {
                if (balance < currentBet) {
                    document.getElementById('message').innerHTML = "<span class='lose-flash'>Nicht genug Coins! Defizit ausgleichen.</span>";
                    playTone(150, 0.3, "sawtooth");
                }
                return;
            }

            isSpinning = true;
            balance -= currentBet;
            document.getElementById('balance').innerText = balance;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('message').innerText = "Die Walzen drehen sich...";

            let intervals = [];
            let counter = 0;
            const duration = 15; // Wie oft es blinkt/dreht

            // Dreheffekt simulieren
            for (let i = 1; i <= 3; i++) {
                let slot = document.getElementById(`slot${i}`);
                intervals[i] = setInterval(() => {
                    let randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                    slot.innerText = randomSymbol;
                    slot.style.transform = `scale(${1 + Math.random()*0.1})`;
                    playTone(300 + (i * 100), 0.02);
                }, 70 + (i * 30));
            }

            // Stoppen nacheinander
            setTimeout(() => { clearInterval(intervals[1]); playTone(600, 0.1, "square"); document.getElementById('slot1').style.transform="scale(1)"; }, 1000);
            setTimeout(() => { clearInterval(intervals[2]); playTone(600, 0.1, "square"); document.getElementById('slot2').style.transform="scale(1)"; }, 1500);
            setTimeout(() => { 
                clearInterval(intervals[3]); 
                document.getElementById('slot3').style.transform="scale(1)";
                checkResult();
            }, 2000);
        }

        function checkResult() {
            const s1 = document.getElementById('slot1').innerText;
            const s2 = document.getElementById('slot2').innerText;
            const s3 = document.getElementById('slot3').innerText;
            const msg = document.getElementById('message');

            isSpinning = false;
            document.getElementById('spinBtn').disabled = false;

            // Logik für Gewinne
            if (s1 === s2 && s2 === s3) {
                // Hauptgewinn (3 gleiche)
                let multiplier = 10;
                if (s1 === '7️⃣') multiplier = 50;
                else if (s1 === '💎') multiplier = 25;

                let winAmount = currentBet * multiplier;
                balance += winAmount;
                msg.innerHTML = `<span class='win-flash'>JACKPOT! 🎉 +${winAmount} Coins!</span>`;
                
                // Siegersound
                playTone(523.25, 0.1); setTimeout(() => playTone(659.25, 0.1), 100); setTimeout(() => playTone(783.99, 0.3), 200);
            } else if (s1 === s2 || s2 === s3 || s1 === s3) {
                // Kleiner Gewinn (2 gleiche)
                let winAmount = Math.floor(currentBet * 2);
                balance += winAmount;
                msg.innerHTML = `<span class='win-flash'>Kleiner Gewinn! 👍 +${winAmount} Coins</span>`;
                playTone(523.25, 0.1); setTimeout(() => playTone(659.25, 0.1), 100);
            } else {
                // Verloren
                msg.innerHTML = "<span class='lose-flash'>Kein Gewinn. Versuchs nochmal!</span>";
                playTone(180, 0.2, "triangle");
            }

            document.getElementById('balance').innerText = balance;

            if (balance <= 0) {
                msg.innerHTML = "💥 PLEITE! Hier sind 500 Trost-Coins!";
                balance = 500;
                document.getElementById('balance').innerText = balance;
            }
            
            if(currentBet > balance) {
                currentBet = balance;
                document.getElementById('bet').innerText = currentBet;
            }
        }
    </script>
</body>
</html>
    </script>
</body>
</html>
