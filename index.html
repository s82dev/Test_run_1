<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Pokemon Catch Trainer</title>
<style>
body{
    margin:0;
    background:#87CEEB;
    overflow:hidden;
    font-family:Arial;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
}

#pokemon{
    position:absolute;
    width:120px;
    height:120px;
    border-radius:50%;
    background:#ffcc00;
    left:50%;
    top:30%;
    transform:translate(-50%,-50%);
}

#circle{
    position:absolute;
    width:140px;
    height:140px;
    border:4px solid lime;
    border-radius:50%;
    left:50%;
    top:30%;
    transform:translate(-50%,-50%);
}

#ball{
    position:absolute;
    width:60px;
    height:60px;
    border-radius:50%;
    background:white;
    border:4px solid black;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
}
</style>
</head>

<body>

<div id="game">
<div id="circle"></div>
<div id="pokemon"></div>
<div id="ball"></div>
</div>

<script>

const ball=document.getElementById("ball");
const pokemon=document.getElementById("pokemon");
const circle=document.getElementById("circle");

let dragging=false;

ball.addEventListener("pointerdown",()=>{
dragging=true;
});

window.addEventListener("pointermove",(e)=>{
if(!dragging)return;

ball.style.left=e.clientX+"px";
ball.style.top=e.clientY+"px";
});

window.addEventListener("pointerup",(e)=>{

dragging=false;

const p=pokemon.getBoundingClientRect();

if(
e.clientX>p.left &&
e.clientX<p.right &&
e.clientY>p.top &&
e.clientY<p.bottom
){
alert("Treffer!");
}

ball.style.left="50%";
ball.style.bottom="40px";
ball.style.top="";
});

let size=140;
let dir=-1;

setInterval(()=>{

size+=dir*2;

if(size<50)dir=1;
if(size>140)dir=-1;

circle.style.width=size+"px";
circle.style.height=size+"px";

},25);

</script>

</body>
</html>
